[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vinhomes-leadership-crawler"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "PyYAML>=6.0", "beautifulsoup4>=4.12", "openpyxl>=3.1"]
[project.optional-dependencies]
test = ["pytest>=8.0"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
